[package]
name = "krill-rss-reader"
version = "0.2.0"
description = "A minimal RSS reader for Linux"
authors = ["Filip"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "krill_rss_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-cli = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"   # used for default_opml_path (config_dir); state/fs helpers come from krill-desktop-core
sha2 = "0.10"
krill-desktop-core = { git = "https://github.com/krill-software/desktop-core", tag = "v0.2.0" }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Feed fetching + parsing
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
feed-rs = "2"
opml = "1.1"
ammonia = "4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
